<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rodriguez Case Manager — Sign In</title><link rel="stylesheet" href="styles.css?v=mobile37">
<style>
body{margin:0;background:linear-gradient(135deg,#071c31,#0d355a);min-height:100vh;font-family:Arial,Helvetica,sans-serif}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.login-card{width:430px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
.login-brand{background:#081f35;color:#fff;padding:28px 30px 23px;border-bottom:5px solid #d2a44b;text-align:center}
.login-brand img{width:82px;height:82px;object-fit:contain;margin-bottom:10px}.login-brand h1{font:700 23px Georgia,serif;margin:4px 0}.login-brand p{margin:4px 0 0;color:#e5cf99;font-size:12px}
.login-body{padding:28px 31px 30px}.login-body label{display:block;color:#33465a;font-size:12px;font-weight:700;margin:0 0 8px}.login-body input{width:100%;height:46px;border:1px solid #cdd5dd;border-radius:7px;font-size:15px;padding:0 12px;outline:none;margin-bottom:16px;box-sizing:border-box}.login-body input:focus{border-color:#0d4777;box-shadow:0 0 0 3px rgba(13,71,119,.10)}
.login-btn{width:100%;margin-top:2px;height:46px}.forgot{display:block;text-align:center;margin-top:16px;font-size:11px;font-weight:700;letter-spacing:.4px;color:#6d7781;cursor:pointer;text-decoration:underline}.login-msg{min-height:18px;margin-top:10px;text-align:center;font-size:12px;color:#a12828}.cloud-note{text-align:center;color:#75808b;font-size:11px;margin-top:15px;line-height:1.5}
</style></head>
<body><div class="login-shell"><div class="login-card"><div class="login-brand"><img src="icon1.png"><h1>Rodriguez Law Firm, LLC</h1><p>Case Management System</p></div>
<div class="login-body"><label>EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="name@lawfirm.com">
<label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="btn btn-primary login-btn" onclick="login()">SIGN IN</button><div id="loginMsg" class="login-msg"></div>
<a class="forgot" onclick="forgotPassword()">FORGOT PASSWORD?</a><div class="cloud-note">Secure shared access • RCM v2 Cloud</div></div></div></div>
<script src="desktop_bridge.js"></script>
<script>
async function ready(){if(window.pywebview&&window.pywebview.api)return;await new Promise(r=>{window.addEventListener('pywebviewready',r,{once:true});setTimeout(r,1500)})}
async function init(){await ready();const s=await window.pywebview.api.auth_status();if(s&&s.authenticated){location.replace('index.html');return}document.getElementById('email').focus()}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg'),btn=document.getElementById('loginBtn');if(!email||!password){msg.textContent='Enter your email and password.';return}msg.textContent='Signing in…';btn.disabled=true;await ready();const r=await window.pywebview.api.auth_login(email,password);btn.disabled=false;if(r&&r.ok){sessionStorage.setItem('rlaw_authenticated','1');location.replace('index.html')}else{msg.textContent=(r&&r.error)||'Sign in failed.'}}
function forgotPassword(){alert('PASSWORD HELP\\n\\nContact your system administrator or software provider for access assistance.\\n\\n10xLABZ\\nPhone: 203-632-9801\\nEmail: contact.10xLabz@gmail.com')}
['email','password'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));init();
</script></body></html>
